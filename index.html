<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#f7e6df" />
<title>Business Ecosystem</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">BE</div>
      <div><strong>Business Ecosystem</strong><span>Master PWA</span></div>
    </div>
    <nav id="nav"></nav>
    <button class="ghost full" id="exportQuick">Backup exportieren</button>
  </aside>
  <main>
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSubtitle">Dein gesamtes Business-Netzwerk auf einen Blick.</p>
      </div>
      <div class="top-actions">
        <button class="secondary" id="addCandidateBtn">+ Kandidat</button>
        <button class="primary" id="addBusinessBtn">+ Business</button>
      </div>
    </header>
    <section id="content"></section>
  </main>
</div>
<div id="modalRoot"></div>
<script src="app.js"></script>
</body>
</html>
